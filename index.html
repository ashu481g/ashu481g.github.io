<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Schedule Summary</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.5; }
    button { padding: 10px 18px; font-size: 16px; border: none; background: #0066cc; color: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0052a3; }
    .card { background: #f8f9fa; border: 1px solid #e1e4e8; padding: 15px; border-radius: 8px; margin-top: 12px; }
    .time { font-size: 0.85em; color: #666; font-weight: 600; }
    .title { font-size: 1.1em; margin-top: 4px; font-weight: 600; }
  </style>
</head>
<body>

  <h2>📅 Today's Schedule Gist</h2>
  <button id="auth-btn" onclick="handleAuthClick()">Sign in with Google</button>
  <button id="signout-btn" onclick="handleSignoutClick()" style="display:none; background:#777;">Sign Out</button>

  <div id="status" style="margin-top: 15px; font-style: italic;"></div>
  <div id="schedule"></div>

  <script>
    // --- PASTE YOUR CLIENT ID HERE ---
    const CLIENT_ID = '254731888816-nqo6vm79nuh59e3nfpuppofco9vl9t6v.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

    let tokenClient;
    let accessToken = null;

    function gapiLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            document.getElementById('status').innerText = 'Authentication error: ' + resp.error;
            return;
          }
          accessToken = resp.access_token;
          document.getElementById('auth-btn').style.display = 'none';
          document.getElementById('signout-btn').style.display = 'inline-block';
          document.getElementById('status').innerText = 'Fetching schedule...';
          await fetchSchedule();
        },
      });
    }

    window.onload = () => {
      if (window.google) gapiLoaded();
    };

    function handleAuthClick() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function handleSignoutClick() {
      if (accessToken) {
        google.accounts.oauth2.revoke(accessToken);
        accessToken = null;
        document.getElementById('auth-btn').style.display = 'inline-block';
        document.getElementById('signout-btn').style.display = 'none';
        document.getElementById('schedule').innerHTML = '';
        document.getElementById('status').innerText = 'Signed out.';
      }
    }

    async function fetchSchedule() {
      const now = new Date();
      const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
      const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(startOfDay)}&timeMax=${encodeURIComponent(endOfDay)}&singleEvents=true&orderBy=startTime`;

      try {
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        
        displayGist(data.items || []);
      } catch (err) {
        document.getElementById('status').innerText = 'Failed to load events.';
        console.error(err);
      }
    }

    function displayGist(events) {
      const container = document.getElementById('schedule');
      document.getElementById('status').innerText = '';

      if (events.length === 0) {
        container.innerHTML = '<p>🎉 No events scheduled for today! Enjoy your free time.</p>';
        return;
      }

      let html = `<p>You have <strong>${events.length}</strong> event(s) today:</p>`;

      events.forEach(event => {
        const start = event.start.dateTime ? new Date(event.start.dateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'All Day';
        const end = event.end.dateTime ? new Date(event.end.dateTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const timeStr = end ? `${start} - ${end}` : start;

        html += `
          <div class="card">
            <div class="time">⏰ ${timeStr}</div>
            <div class="title">${event.summary || 'Untitled Event'}</div>
            ${event.description ? `<div style="font-size:0.9em; color:#555; margin-top:5px;">${event.description}</div>` : ''}
          </div>
        `;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
