<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F7F4EC;
    --paper-line: #E4DDC9;
    --ink: #1C1A17;
    --ink-soft: #6B6558;
    --brass: #8A6B3F;
    --brass-soft: #C9B48C;
    --present: #3F6B4F;
    --present-bg: #E7EEE3;
    --absent: #A34632;
    --absent-bg: #F3E4DE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    max-width:920px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:36px;
  }
  header h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:clamp(28px,4vw,38px);
    margin:0;
    letter-spacing:-0.01em;
  }
  header .today{
    font-size:13px;
    color:var(--ink-soft);
  }
  .layout{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:0;
    border:1px solid var(--paper-line);
    background:#fff;
    min-height:520px;
  }
  @media (max-width:680px){
    .layout{grid-template-columns:1fr;}
    .spine{border-right:none;border-bottom:1px solid var(--paper-line);}
  }

  /* --- Spine: subject list --- */
  .spine{
    border-right:1px solid var(--paper-line);
    padding:20px 0;
    background:#FBFAF5;
  }
  .spine-label{
    font-size:11px;
    color:var(--ink-soft);
    padding:0 20px 12px;
    letter-spacing:0.02em;
  }
  .subject-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .subject-list li{
    position:relative;
  }
  .subject-btn{
    width:100%;
    text-align:left;
    background:none;
    border:none;
    font-family:'Source Serif 4',serif;
    font-size:17px;
    color:var(--ink);
    padding:11px 20px;
    cursor:pointer;
    display:block;
    border-left:3px solid transparent;
  }
  .subject-btn:hover{background:var(--paper);}
  .subject-btn.active{
    background:var(--paper);
    border-left-color:var(--brass);
    font-weight:600;
  }
  .subject-empty{
    padding:0 20px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .add-subject{
    padding:16px 20px 4px;
    border-top:1px solid var(--paper-line);
    margin-top:14px;
  }
  .add-subject form{
    display:flex;
    gap:6px;
  }
  .add-subject input{
    flex:1;
    min-width:0;
    padding:8px 9px;
    border:1px solid var(--brass-soft);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    border-radius:2px;
  }
  .add-subject input:focus{outline:2px solid var(--brass);outline-offset:1px;}
  .add-subject button{
    padding:8px 12px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    cursor:pointer;
    border-radius:2px;
    font-family:'Inter',sans-serif;
  }
  .add-subject button:hover{background:#3a352c;}

  /* --- Main panel --- */
  .panel{
    padding:28px 32px 32px;
  }
  .no-subject{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.6;
    padding-top:40px;
    text-align:center;
  }
  .panel-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
  }
  .panel-header h2{
    font-family:'Source Serif 4',serif;
    font-size:24px;
    margin:0;
  }
  .tabs{
    display:flex;
    gap:2px;
    background:var(--paper-line);
    padding:2px;
    border-radius:3px;
  }
  .tab{
    border:none;
    background:transparent;
    padding:7px 14px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    border-radius:2px;
    color:var(--ink-soft);
  }
  .tab.active{
    background:#fff;
    color:var(--ink);
  }

  /* Mark form */
  .mark-form{
    display:flex;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    padding:18px 20px;
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:3px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:12px;
    color:var(--ink-soft);
  }
  .field input[type="date"]{
    padding:9px 10px;
    border:1px solid var(--brass-soft);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    border-radius:2px;
    color:var(--ink);
  }
  .status-toggle{
    display:flex;
    gap:8px;
  }
  .status-toggle button{
    padding:9px 16px;
    border:1px solid var(--paper-line);
    background:#fff;
    font-size:13px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    border-radius:2px;
    color:var(--ink-soft);
  }
  .status-toggle button.sel-present.selected{
    background:var(--present-bg);
    border-color:var(--present);
    color:var(--present);
  }
  .status-toggle button.sel-absent.selected{
    background:var(--absent-bg);
    border-color:var(--absent);
    color:var(--absent);
  }
  .save-btn{
    padding:10px 20px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    border-radius:2px;
    font-family:'Inter',sans-serif;
  }
  .save-btn:hover{background:#3a352c;}
  .save-btn:disabled{
    background:#ccc5b3;
    border-color:#ccc5b3;
    cursor:not-allowed;
  }
  .form-note{
    font-size:12px;
    color:var(--brass);
    margin-top:12px;
    min-height:16px;
  }

  /* Summary */
  .summary{
    display:flex;
    gap:28px;
    margin:24px 2px 8px;
    flex-wrap:wrap;
  }
  .summary .stat{
    display:flex;
    flex-direction:column;
  }
  .summary .stat .num{
    font-family:'Source Serif 4',serif;
    font-size:26px;
    font-weight:600;
  }
  .summary .stat .lbl{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .summary .stat.present .num{color:var(--present);}
  .summary .stat.absent .num{color:var(--absent);}

  /* Log */
  .log-list{
    list-style:none;
    margin:18px 0 0;
    padding:0;
    border-top:1px solid var(--paper-line);
  }
  .log-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px solid var(--paper-line);
    font-size:14px;
  }
  .log-row .date{
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .log-row .weekday{
    color:var(--ink-soft);
    font-size:12.5px;
    margin-left:8px;
  }
  .log-row .status-pill{
    font-size:12px;
    font-weight:600;
    padding:3px 10px;
    border-radius:20px;
  }
  .status-pill.present{background:var(--present-bg);color:var(--present);}
  .status-pill.absent{background:var(--absent-bg);color:var(--absent);}
  .log-empty{
    padding:32px 4px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>Attendance Register</h1>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="layout">
    <div class="spine">
      <div class="spine-label">SUBJECTS</div>
      <ul class="subject-list" id="subjectList"></ul>
      <div class="add-subject">
        <form id="addSubjectForm">
          <input type="text" id="newSubjectInput" placeholder="Add subject" maxlength="60" autocomplete="off">
          <button type="submit">Add</button>
        </form>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="no-subject">Add a subject on the left, then select it here to mark or view attendance.</div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = "attendanceRegisterData";
  let state = load();
  let activeSubject = state.subjects.length ? state.subjects[0] : null;
  let activeTab = "mark"; // "mark" | "view"
  let selectedStatus = null; // "present" | "absent"

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { subjects: [], records: {} }; // records: { subject: { "YYYY-MM-DD": "present"|"absent" } }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function todayLabel(){
    const d = new Date();
    document.getElementById('todayLabel').textContent = d.toLocaleDateString(undefined,{ weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }

  function renderSubjectList(){
    const ul = document.getElementById('subjectList');
    ul.innerHTML = "";
    if(state.subjects.length === 0){
      const li = document.createElement('li');
      li.innerHTML = '<div class="subject-empty">No subjects yet. Add your first one below.</div>';
      ul.appendChild(li);
      return;
    }
    state.subjects.forEach(subj => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'subject-btn' + (subj === activeSubject ? ' active' : '');
      btn.textContent = subj;
      btn.addEventListener('click', () => {
        activeSubject = subj;
        selectedStatus = null;
        renderAll();
      });
      li.appendChild(btn);
      ul.appendChild(li);
    });
  }

  function renderPanel(){
    const panel = document.getElementById('panel');
    if(!activeSubject){
      panel.innerHTML = '<div class="no-subject">Add a subject on the left, then select it here to mark or view attendance.</div>';
      return;
    }

    panel.innerHTML = `
      <div class="panel-header">
        <h2>${escapeHtml(activeSubject)}</h2>
        <div class="tabs">
          <button class="tab ${activeTab==='mark'?'active':''}" data-tab="mark">Mark attendance</button>
          <button class="tab ${activeTab==='view'?'active':''}" data-tab="view">View log</button>
        </div>
      </div>
      <div id="tabBody"></div>
    `;

    panel.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        activeTab = t.dataset.tab;
        selectedStatus = null;
        renderPanel();
      });
    });

    if(activeTab === 'mark') renderMarkTab();
    else renderViewTab();
  }

  function renderMarkTab(){
    const body = document.getElementById('tabBody');
    body.innerHTML = `
      <div class="mark-form">
        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput">
        </div>
        <div class="field">
          <label>Status</label>
          <div class="status-toggle">
            <button type="button" class="sel-present" id="selPresent">Present</button>
            <button type="button" class="sel-absent" id="selAbsent">Absent</button>
          </div>
        </div>
        <button class="save-btn" id="saveBtn" disabled>Save entry</button>
      </div>
      <div class="form-note" id="formNote"></div>
    `;

    const dateInput = document.getElementById('dateInput');
    const selPresent = document.getElementById('selPresent');
    const selAbsent = document.getElementById('selAbsent');
    const saveBtn = document.getElementById('saveBtn');
    const formNote = document.getElementById('formNote');
    // Note: dateInput.value intentionally left blank — user must pick a date themselves.

    function updateNote(){
      const d = dateInput.value;
      if(d && state.records[activeSubject] && state.records[activeSubject][d]){
        const existing = state.records[activeSubject][d];
        formNote.textContent = `Already marked ${existing} for this date — saving will overwrite it.`;
      } else {
        formNote.textContent = "";
      }
      saveBtn.disabled = !(dateInput.value && selectedStatus);
    }

    dateInput.addEventListener('change', updateNote);
    selPresent.addEventListener('click', () => {
      selectedStatus = 'present';
      selPresent.classList.add('selected');
      selAbsent.classList.remove('selected');
      updateNote();
    });
    selAbsent.addEventListener('click', () => {
      selectedStatus = 'absent';
      selAbsent.classList.add('selected');
      selPresent.classList.remove('selected');
      updateNote();
    });

    saveBtn.addEventListener('click', () => {
      if(!dateInput.value || !selectedStatus) return;
      if(!state.records[activeSubject]) state.records[activeSubject] = {};
      state.records[activeSubject][dateInput.value] = selectedStatus;
      save();
      selectedStatus = null;
      const savedDate = dateInput.value;
      renderMarkTab();
      const note = document.getElementById('formNote');
      note.textContent = `Saved: ${formatDate(savedDate)}.`;
    });

    updateNote();
  }

  function renderViewTab(){
    const body = document.getElementById('tabBody');
    const records = state.records[activeSubject] || {};
    const dates = Object.keys(records).sort();
    const presentCount = dates.filter(d => records[d] === 'present').length;
    const absentCount = dates.filter(d => records[d] === 'absent').length;
    const total = dates.length;
    const pct = total ? Math.round((presentCount/total)*100) : 0;

    let html = `
      <div class="summary">
        <div class="stat"><div class="num">${total}</div><div class="lbl">Total marked</div></div>
        <div class="stat present"><div class="num">${presentCount}</div><div class="lbl">Present</div></div>
        <div class="stat absent"><div class="num">${absentCount}</div><div class="lbl">Absent</div></div>
        <div class="stat"><div class="num">${pct}%</div><div class="lbl">Attendance</div></div>
      </div>
    `;

    if(total === 0){
      html += `<div class="log-empty">No attendance marked yet for ${escapeHtml(activeSubject)}.</div>`;
    } else {
      html += '<ul class="log-list">';
      dates.slice().reverse().forEach(d => {
        const status = records[d];
        html += `
          <li class="log-row">
            <span><span class="date">${formatDate(d)}</span><span class="weekday">${weekday(d)}</span></span>
            <span class="status-pill ${status}">${status === 'present' ? 'Present' : 'Absent'}</span>
          </li>
        `;
      });
      html += '</ul>';
    }

    body.innerHTML = html;
  }

  function formatDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
  }
  function weekday(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString(undefined, { weekday:'short' });
  }
  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  document.getElementById('addSubjectForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('newSubjectInput');
    const name = input.value.trim();
    if(!name) return;
    if(state.subjects.includes(name)){
      input.value = '';
      return;
    }
    state.subjects.push(name);
    save();
    activeSubject = name;
    activeTab = 'mark';
    input.value = '';
    renderAll();
  });

  function renderAll(){
    renderSubjectList();
    renderPanel();
  }

  todayLabel();
  renderAll();
})();
</script>
</body>
</html>
