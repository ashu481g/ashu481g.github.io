<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Yoga</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF1EE;
    --surface: #FFFFFF;
    --ink: #1E2B3A;
    --muted: #5F6F68;
    --sage: #7C9A86;
    --sun: #E3A72F;
    --line: #D3DDD6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141C24;
      --surface: #1D2833;
      --ink: #E8EEEA;
      --muted: #9DB0A6;
      --sage: #8FB09A;
      --sun: #F0B84A;
      --line: #2C3A46;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  main {
    max-width: 1360px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "center" "breath" "books";
    gap: 3rem;
    align-items: start;
  }
  .center { grid-area: center; min-width: 0; }
  #breathingSection { grid-area: breath; }
  #pdfSection { grid-area: books; }
  @media (min-width: 1080px) {
    main {
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(220px, 300px);
      grid-template-areas: "books center breath";
      gap: 2.5rem;
    }
    section.extra {
      position: sticky;
      top: calc(1.5rem + env(safe-area-inset-top, 0px));
      max-height: calc(100vh - 3rem);
      overflow-y: auto;
      padding-top: 0.4rem;
    }
  }
  header { margin-bottom: 1.5rem; }
  .date {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 0.25rem;
  }
  h1 {
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.25rem, 7vw, 3.5rem);
    line-height: 1.05;
    margin: 0;
  }
  .session {
    font-size: 1.2rem;
    color: var(--muted);
    margin: 0.5rem 0 0;
  }
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
  }
  .player iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .audio-panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1rem;
    padding: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    text-align: center;
  }
  .audio-panel[hidden] { display: none; }
  .round {
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    margin: 0;
  }
  .repeat { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: center; }
  .repeat-label { color: var(--muted); font-size: 0.9rem; margin-right: 0.25rem; }
  .rep {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: inherit; font-weight: 500; font-size: 0.9rem;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .rep:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
  .rep[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: #fff; }
  .total { margin: 0; color: var(--muted); font-size: 0.9rem; min-height: 1.35em; }
  .audio-panel audio { width: min(100%, 420px); }
  @media (max-width: 520px) {
    .player:has(.audio-panel:not([hidden])) { aspect-ratio: auto; min-height: 300px; }
  }
  .fallback {
    margin: 0.75rem 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .fallback a { color: var(--ink); text-underline-offset: 3px; }

  .week {
    margin-top: 2.25rem;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.5rem;
  }
  .day {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    aspect-ratio: 1;
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    position: relative;
    display: grid;
    place-items: center;
    transition: background-color .2s, border-color .2s;
  }
  .day:hover { border-color: var(--sage); }
  .day:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; }
  .day[aria-pressed="true"] {
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
  }
  .day.today::after {
    content: "";
    position: absolute;
    bottom: -9px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sun);
  }
  .legend {
    margin: 1.1rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  .legend span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--sun); display: inline-block;
  }
  section.extra { margin-top: 0; min-width: 0; }
  section.extra[hidden] { display: none; }
  h2 {
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.6rem;
    margin: 0 0 0.35rem;
  }
  .hint { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .list li { border-bottom: 1px solid var(--line); }
  .item {
    display: flex; align-items: center; gap: 0.9rem;
    width: 100%;
    padding: 0.9rem 0.25rem;
    background: none; border: 0;
    color: var(--ink); font: inherit; text-align: left;
    text-decoration: none; cursor: pointer;
  }
  .item:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .item:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
  .item[aria-current="true"] .name { color: var(--sage); font-weight: 600; }
  .icon {
    flex: none;
    width: 2.25rem; height: 2.25rem;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 0.8rem; font-weight: 600; color: var(--muted);
  }
  .name { flex: 1; }
  .action { color: var(--muted); font-size: 0.85rem; flex: none; }
  @media (max-width: 420px) {
    .week { gap: 0.3rem; }
    .day { font-size: 0.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .day { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="extra" id="pdfSection" hidden>
    <h2>Books</h2>
    <p class="hint">Each book opens in a new tab.</p>
    <ul class="list" id="pdfList"></ul>
  </section>

  <div class="center">
    <header>
      <p class="date" id="date"></p>
      <h1 id="dayName">Loading…</h1>
      <p class="session" id="session"></p>
    </header>

    <div class="player">
      <iframe id="video" title="Yoga session video" allow="autoplay; fullscreen" allowfullscreen></iframe>
      <div class="audio-panel" id="audioPanel" hidden>
        <p class="round" id="round">Ready</p>
        <div class="repeat" role="group" aria-label="How many times to play">
          <span class="repeat-label">Repeat</span>
          <button type="button" class="rep" data-n="1">Once</button>
          <button type="button" class="rep" data-n="15">15 times</button>
          <button type="button" class="rep" data-n="30">30 times</button>
        </div>
        <p class="total" id="total"></p>
        <audio id="audio" controls preload="metadata"></audio>
      </div>
    </div>
    <p class="fallback">Not loading? <a id="driveLink" href="#" target="_blank" rel="noopener">Open it in Google Drive</a></p>

    <nav class="week" id="week" aria-label="Choose a day"></nav>
    <p class="legend"><span></span> Today</p>
  </div>

  <section class="extra" id="breathingSection" hidden>
    <h2>Breathing &amp; Pranayam</h2>
    <p class="hint">Pick a session to play it in the main player.</p>
    <ul class="list" id="breathingList"></ul>
  </section>
</main>

<script>
  // Index matches JavaScript's getDay(): 0 = Sunday … 6 = Saturday
  const SESSIONS = [
    { day: "Sunday",    title: "Face Yoga by Kashish Makhijani", id: "1KFa6751b46YLq7Ch-I8tNupXhB2WZOPI" },
    { day: "Monday",    title: "Light Yoga & Breathing",         id: "1bGaAw8qS3PJLrAtaynHA5d5sJVngn2ej" },
    { day: "Tuesday",   title: "Lower Body",                     id: "1hJBJhwe2yrPlJZXXULcbvvMZMl3K4LQU" },
    { day: "Wednesday", title: "Upper Body",                     id: "1Mwwt3Qn_GWSQ7S9GyEsDYxjG0fE2P7ha" },
    { day: "Thursday",  title: "Core & Laughter",                id: "1kyuIp2IkECr4eWZrZmgKA_AeluX9w45r" },
    { day: "Friday",    title: "Flexibility",                    id: "1oh20L96CNaZfhOEGGLFZwamrQ2lAhQ7b" },
    { day: "Saturday",  title: "Stamina & Meditation",           id: "1PCgFgZSk044CqAelcSozR9LB-jKaDYpx" }
  ];
  const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Mon → Sun

  const now = new Date();
  const todayIdx = now.getDay();

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });

  const weekEl = document.getElementById("week");
  const buttons = {};

  WEEK_ORDER.forEach(i => {
    const b = document.createElement("button");
    b.className = "day" + (i === todayIdx ? " today" : "");
    b.textContent = SESSIONS[i].day.slice(0, 3);
    b.setAttribute("aria-label", SESSIONS[i].day + ": " + SESSIONS[i].title);
    b.addEventListener("click", () => show(i));
    weekEl.appendChild(b);
    buttons[i] = b;
  });

  // ── Paste the output of the Apps Script here (replace these two lines) ──
  const BREATHING = [
 {
  "name": "4-7-8-breathing-timer-breathingmeditation.mp3",
  "id": "1Z6D8uPrlynrv3KkbORqWp8IY5k6lCeJC",
  "kind": "audio"
 },
 {
  "name": "PRANAYAM COUNTS IN HINDI ART OF LIVING.m4a",
  "id": "1OEwKq_FsdEb_uwWdrUuVMDzLPNP_r3fQ",
  "kind": "audio"
 },
 {
  "name": "Special Breathing Session ‪@saurabhbothra.mp4",
  "id": "1jq2QioEfndRlC-upSg3HWm2ZLri3OcDc",
  "kind": "video"
 }
];
const PDFS = [
 {
  "name": "Diabetes Reversal Recipe Handbook.pdf",
  "id": "1eoEWU1W4IJfWtKmdneXGBrYu9h6OuYN9"
 },
 {
  "name": "freeyoga_Prakriti_handbook.pdf",
  "id": "1tjvLcU3994FUIdUv1ShCJcd5JDcuEYWh"
 },
 {
  "name": "Habuild Pranayama Handbook.pdf",
  "id": "1HE85wSPdQnnFTxcGTwoACVJE1VcyNAre"
 },
 {
  "name": "Habuild Yoga Handbook.pdf",
  "id": "1dN27ehD57xQRI-kt9jusT10UbVKZTtHe"
 },
 {
  "name": "Immunity Booster recipe Handbook.pdf",
  "id": "1YlCH7eoI30d8sFQiT0cB7PUP4JZSKhCD"
 },
 {
  "name": "Millets Handbook.pdf",
  "id": "10sWRi2XjrchlPaN7CiRmRfRY5HMFYJTD"
 },
 {
  "name": "Recovery_Drinks_Handbook.pdf",
  "id": "1VibcrWW1OkwHU0x_LSKiRY014lbZ1Edk"
 },
 {
  "name": "Summer Drinks Handbook.pdf",
  "id": "15h15Emq8FWGMODrOpH3vVlFxbkOOCRZv"
 },
 {
  "name": "Summer Skincare Recipe.pdf",
  "id": "1hVahztBNHC4wRS7DKiiM9Aoy6Vv3elWV"
 }
];
  // ────────────────────────────────────────────────────────────────────────

  // Turn file names into readable titles: drop extension, dates, weekday names and stray separators
  const MONTHS = "(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\\.?";
  const DATE_PATTERNS = [
    new RegExp("\\b\\d{1,2}(?:st|nd|rd|th)?[\\s\\-_]*" + MONTHS + "(?:[\\s,\\-_]*\\d{4}|[\\s,\\-_]+\\d{2})?\\b", "gi"), // 1st Feb 2025
    new RegExp("\\b" + MONTHS + "[\\s\\-_]*\\d{1,2}(?:st|nd|rd|th)?(?:[\\s,\\-_]*\\d{4})?\\b", "gi"),                  // Feb 1, 2025
    /\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{4}\b/g,   // 01-02-2025
    /\b\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}\b/g,   // 2025-02-01
    /\b\d{1,2}[\/.]\d{1,2}[\/.]\d{2}\b/g,       // 01/02/25
    /\b(?:mon|tues|wednes|thurs|fri|satur|sun)day\b/gi
  ];
  function clean(n) {
    let t = n.replace(/\.(mp4|mov|mkv|webm|pdf|mp3|m4a|wav|aac|ogg)$/i, "").replace(/_/g, " ");
    DATE_PATTERNS.forEach(re => { t = t.replace(re, " "); });
    t = t.replace(/(?<!\d)-|-(?!\d)/g, " ")          // hyphens become spaces, but keep 4-7-8
         .replace(/\s*[｜|·]\s*/g, " · ")
         .replace(/(\s·\s*)+/g, " · ")
         .replace(/\s+/g, " ")
         .replace(/^[\s·,]+|[\s·,]+$/g, "");
    return t || n;
  }

  const breathingButtons = [];
  const videoEl = document.getElementById("video");
  const panel = document.getElementById("audioPanel");
  const audio = document.getElementById("audio");
  const roundEl = document.getElementById("round");
  const totalEl = document.getElementById("total");
  const repButtons = [...document.querySelectorAll(".rep")];
  let target = 1, played = 0;

  function setHeading(heading, subtitle) {
    document.getElementById("dayName").textContent = heading;
    document.getElementById("session").textContent = subtitle;
  }

  function stopAudio() {
    audio.pause();
    panel.hidden = true;
    videoEl.hidden = false;
  }

  function load(id, heading, subtitle) {
    stopAudio();
    setHeading(heading, subtitle);
    videoEl.src = "https://drive.google.com/file/d/" + id + "/preview";
    document.getElementById("driveLink").href = "https://drive.google.com/file/d/" + id + "/view";
  }

  function fmt(sec) {
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m ? m + " min" + (s ? " " + s + " s" : "") : s + " s";
  }
  function updateRound() {
    roundEl.textContent = target === 1 ? (played ? "Done" : "Ready")
      : (played >= target ? "Done · " + target + " rounds" : "Round " + Math.min(played + 1, target) + " of " + target);
    totalEl.textContent = isFinite(audio.duration) && audio.duration > 0
      ? "Total about " + fmt(audio.duration * target) : "";
  }
  function setTarget(n) {
    target = n; played = 0;
    repButtons.forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.n) === n)));
    updateRound();
  }
  repButtons.forEach(b => b.addEventListener("click", () => {
    setTarget(Number(b.dataset.n));
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }));

  audio.addEventListener("loadedmetadata", () => {
    // Short tracks like the 19-second 4-7-8 timer default to 15 repeats
    if (audio.dataset.fresh === "1") { setTarget(audio.duration < 120 ? 15 : 1); audio.dataset.fresh = "0"; }
    updateRound();
  });
  audio.addEventListener("ended", () => {
    played++;
    if (played < target) { audio.currentTime = 0; audio.play().catch(() => {}); }
    updateRound();
  });
  audio.addEventListener("error", () => {
    roundEl.textContent = "This track can't play here";
    totalEl.textContent = "Use the Google Drive link below, or host the file with the page.";
  });

  function loadAudio(item, heading, subtitle) {
    videoEl.src = "about:blank";
    videoEl.hidden = true;
    panel.hidden = false;
    setHeading(heading, subtitle);
    document.getElementById("driveLink").href = "https://drive.google.com/file/d/" + item.id + "/view";
    audio.dataset.fresh = "1";
    audio.src = item.src || ("https://drive.google.com/uc?export=download&id=" + item.id);
    setTarget(1);
    roundEl.textContent = "Loading…";
  }

  function show(i) {
    const s = SESSIONS[i];
    load(s.id, i === todayIdx ? "Today, " + s.day : s.day, s.title);
    Object.entries(buttons).forEach(([k, b]) => b.setAttribute("aria-pressed", String(Number(k) === i)));
    breathingButtons.forEach(b => b.removeAttribute("aria-current"));
  }

  const isAudioItem = v => v.kind === "audio" || /\.(mp3|m4a|wav|aac|ogg)$/i.test(v.name);

  function showBreathing(idx) {
    const item = BREATHING[idx];
    if (isAudioItem(item)) loadAudio(item, "Breathing & Pranayam", clean(item.name));
    else load(item.id, "Breathing & Pranayam", clean(item.name));
    Object.values(buttons).forEach(b => b.setAttribute("aria-pressed", "false"));
    breathingButtons.forEach((b, k) => b.setAttribute("aria-current", String(k === idx)));
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelector(".player").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  }

  if (BREATHING.length) {
    const ul = document.getElementById("breathingList");
    BREATHING.forEach((v, idx) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const isAudio = isAudioItem(v);
      b.className = "item";
      b.innerHTML = '<span class="icon">' + (isAudio ? "♪" : idx + 1) + '</span><span class="name"></span><span class="action">' + (isAudio ? "Listen" : "Play") + '</span>';
      b.querySelector(".name").textContent = clean(v.name);
      b.addEventListener("click", () => showBreathing(idx));
      li.appendChild(b); ul.appendChild(li);
      breathingButtons.push(b);
    });
    document.getElementById("breathingSection").hidden = false;
  }

  if (PDFS.length) {
    const ul = document.getElementById("pdfList");
    PDFS.forEach(p => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "item";
      a.href = "https://drive.google.com/file/d/" + p.id + "/view";
      a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = '<span class="icon">PDF</span><span class="name"></span><span class="action">Open</span>';
      a.querySelector(".name").textContent = clean(p.name);
      li.appendChild(a); ul.appendChild(li);
    });
    document.getElementById("pdfSection").hidden = false;
  }

  show(todayIdx);
</script>
</body>
</html>
