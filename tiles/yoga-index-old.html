<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Yoga</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF1EE;
    --surface: #FFFFFF;
    --ink: #1E2B3A;
    --muted: #5F6F68;
    --sage: #7C9A86;
    --sun: #E3A72F;
    --line: #D3DDD6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141C24;
      --surface: #1D2833;
      --ink: #E8EEEA;
      --muted: #9DB0A6;
      --sage: #8FB09A;
      --sun: #F0B84A;
      --line: #2C3A46;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 2rem 1.25rem 3rem;
  }
  header { margin-bottom: 1.5rem; }
  .date {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 0.25rem;
  }
  h1 {
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.25rem, 7vw, 3.5rem);
    line-height: 1.05;
    margin: 0;
  }
  .session {
    font-size: 1.2rem;
    color: var(--muted);
    margin: 0.5rem 0 0;
  }
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
  }
  .player iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .fallback {
    margin: 0.75rem 0 0;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .fallback a { color: var(--ink); text-underline-offset: 3px; }

  .week {
    margin-top: 2.25rem;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.5rem;
  }
  .day {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    aspect-ratio: 1;
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    position: relative;
    display: grid;
    place-items: center;
    transition: background-color .2s, border-color .2s;
  }
  .day:hover { border-color: var(--sage); }
  .day:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; }
  .day[aria-pressed="true"] {
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
  }
  .day.today::after {
    content: "";
    position: absolute;
    bottom: -9px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--sun);
  }
  .legend {
    margin: 1.1rem 0 0;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }
  .legend span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--sun); display: inline-block;
  }
  section.extra { margin-top: 3rem; }
  section.extra[hidden] { display: none; }
  h2 {
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.6rem;
    margin: 0 0 0.35rem;
  }
  .hint { margin: 0 0 1rem; color: var(--muted); font-size: 0.95rem; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .list li { border-bottom: 1px solid var(--line); }
  .item {
    display: flex; align-items: center; gap: 0.9rem;
    width: 100%;
    padding: 0.9rem 0.25rem;
    background: none; border: 0;
    color: var(--ink); font: inherit; text-align: left;
    text-decoration: none; cursor: pointer;
  }
  .item:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .item:focus-visible { outline: 3px solid var(--sage); outline-offset: 2px; }
  .item[aria-current="true"] .name { color: var(--sage); font-weight: 600; }
  .icon {
    flex: none;
    width: 2.25rem; height: 2.25rem;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 0.8rem; font-weight: 600; color: var(--muted);
  }
  .name { flex: 1; }
  .action { color: var(--muted); font-size: 0.85rem; flex: none; }
  @media (max-width: 420px) {
    .week { gap: 0.3rem; }
    .day { font-size: 0.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .day { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="date" id="date"></p>
    <h1 id="dayName">Loading…</h1>
    <p class="session" id="session"></p>
  </header>

  <div class="player">
    <iframe id="video" title="Yoga session video" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
  <p class="fallback">Video not loading? <a id="driveLink" href="#" target="_blank" rel="noopener">Open it in Google Drive</a></p>

  <nav class="week" id="week" aria-label="Choose a day"></nav>
  <p class="legend"><span></span> Today</p>

  <section class="extra" id="breathingSection" hidden>
    <h2>Breathing &amp; Pranayam</h2>
    <p class="hint">Pick any session to play it in the player above.</p>
    <ul class="list" id="breathingList"></ul>
  </section>

  <section class="extra" id="pdfSection" hidden>
    <h2>Reading material</h2>
    <p class="hint">Each document opens in a new tab.</p>
    <ul class="list" id="pdfList"></ul>
  </section>
</main>

<script>
  // Index matches JavaScript's getDay(): 0 = Sunday … 6 = Saturday
  const SESSIONS = [
    { day: "Sunday",    title: "Face Yoga by Kashish Makhijani", id: "1KFa6751b46YLq7Ch-I8tNupXhB2WZOPI" },
    { day: "Monday",    title: "Light Yoga & Breathing",         id: "1bGaAw8qS3PJLrAtaynHA5d5sJVngn2ej" },
    { day: "Tuesday",   title: "Lower Body",                     id: "1hJBJhwe2yrPlJZXXULcbvvMZMl3K4LQU" },
    { day: "Wednesday", title: "Upper Body",                     id: "1Mwwt3Qn_GWSQ7S9GyEsDYxjG0fE2P7ha" },
    { day: "Thursday",  title: "Core & Laughter",                id: "1kyuIp2IkECr4eWZrZmgKA_AeluX9w45r" },
    { day: "Friday",    title: "Flexibility",                    id: "1oh20L96CNaZfhOEGGLFZwamrQ2lAhQ7b" },
    { day: "Saturday",  title: "Stamina & Meditation",           id: "1PCgFgZSk044CqAelcSozR9LB-jKaDYpx" }
  ];
  const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0]; // Mon → Sun

  const now = new Date();
  const todayIdx = now.getDay();

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });

  const weekEl = document.getElementById("week");
  const buttons = {};

  WEEK_ORDER.forEach(i => {
    const b = document.createElement("button");
    b.className = "day" + (i === todayIdx ? " today" : "");
    b.textContent = SESSIONS[i].day.slice(0, 3);
    b.setAttribute("aria-label", SESSIONS[i].day + ": " + SESSIONS[i].title);
    b.addEventListener("click", () => show(i));
    weekEl.appendChild(b);
    buttons[i] = b;
  });

  // ── Paste the output of the Apps Script here (replace these two lines) ──
  const BREATHING = [
 {
  "name": "4-7-8-breathing-timer-breathingmeditation.mp3",
  "id": "1Z6D8uPrlynrv3KkbORqWp8IY5k6lCeJC",
  "kind": "audio"
 },
 {
  "name": "PRANAYAM COUNTS IN HINDI ART OF LIVING.m4a",
  "id": "1OEwKq_FsdEb_uwWdrUuVMDzLPNP_r3fQ",
  "kind": "audio"
 },
 {
  "name": "Special Breathing Session for 9th FEB ‪@saurabhbothra.mp4",
  "id": "1jq2QioEfndRlC-upSg3HWm2ZLri3OcDc",
  "kind": "video"
 }
];
const PDFS = [
 {
  "name": "Diabetes Reversal Recipe Handbook.pdf",
  "id": "1eoEWU1W4IJfWtKmdneXGBrYu9h6OuYN9"
 },
 {
  "name": "freeyoga_Prakriti_handbook.pdf",
  "id": "1tjvLcU3994FUIdUv1ShCJcd5JDcuEYWh"
 },
 {
  "name": "Habuild Pranayama Handbook.pdf",
  "id": "1HE85wSPdQnnFTxcGTwoACVJE1VcyNAre"
 },
 {
  "name": "Habuild Yoga Handbook.pdf",
  "id": "1dN27ehD57xQRI-kt9jusT10UbVKZTtHe"
 },
 {
  "name": "Immunity Booster recipe Handbook.pdf",
  "id": "1YlCH7eoI30d8sFQiT0cB7PUP4JZSKhCD"
 },
 {
  "name": "Millets Handbook.pdf",
  "id": "10sWRi2XjrchlPaN7CiRmRfRY5HMFYJTD"
 },
 {
  "name": "Recovery_Drinks_Handbook.pdf",
  "id": "1VibcrWW1OkwHU0x_LSKiRY014lbZ1Edk"
 },
 {
  "name": "Summer Drinks Handbook.pdf",
  "id": "15h15Emq8FWGMODrOpH3vVlFxbkOOCRZv"
 },
 {
  "name": "Summer Skincare Recipe.pdf",
  "id": "1hVahztBNHC4wRS7DKiiM9Aoy6Vv3elWV"
 }
];
  // ────────────────────────────────────────────────────────────────────────

  const clean = n => n.replace(/\.(mp4|mov|mkv|pdf|mp3|m4a|wav|aac|ogg)$/i, "").replace(/[｜|]/g, "·").trim();
  const breathingButtons = [];

  function load(id, heading, subtitle) {
    document.getElementById("dayName").textContent = heading;
    document.getElementById("session").textContent = subtitle;
    document.getElementById("video").src = "https://drive.google.com/file/d/" + id + "/preview";
    document.getElementById("driveLink").href = "https://drive.google.com/file/d/" + id + "/view";
  }

  function show(i) {
    const s = SESSIONS[i];
    load(s.id, i === todayIdx ? "Today, " + s.day : s.day, s.title);
    Object.entries(buttons).forEach(([k, b]) => b.setAttribute("aria-pressed", String(Number(k) === i)));
    breathingButtons.forEach(b => b.removeAttribute("aria-current"));
  }

  function showBreathing(idx) {
    load(BREATHING[idx].id, "Breathing & Pranayam", clean(BREATHING[idx].name));
    Object.values(buttons).forEach(b => b.setAttribute("aria-pressed", "false"));
    breathingButtons.forEach((b, k) => b.setAttribute("aria-current", String(k === idx)));
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelector(".player").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  }

  if (BREATHING.length) {
    const ul = document.getElementById("breathingList");
    BREATHING.forEach((v, idx) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      const isAudio = v.kind === "audio" || /\.(mp3|m4a|wav|aac|ogg)$/i.test(v.name);
      b.className = "item";
      b.innerHTML = '<span class="icon">' + (isAudio ? "♪" : idx + 1) + '</span><span class="name"></span><span class="action">' + (isAudio ? "Listen" : "Play") + '</span>';
      b.querySelector(".name").textContent = clean(v.name);
      b.addEventListener("click", () => showBreathing(idx));
      li.appendChild(b); ul.appendChild(li);
      breathingButtons.push(b);
    });
    document.getElementById("breathingSection").hidden = false;
  }

  if (PDFS.length) {
    const ul = document.getElementById("pdfList");
    PDFS.forEach(p => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "item";
      a.href = "https://drive.google.com/file/d/" + p.id + "/view";
      a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = '<span class="icon">PDF</span><span class="name"></span><span class="action">Open</span>';
      a.querySelector(".name").textContent = clean(p.name);
      li.appendChild(a); ul.appendChild(li);
    });
    document.getElementById("pdfSection").hidden = false;
  }

  show(todayIdx);
</script>
</body>
</html>
