<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driving Test Quiz - 20 Random Questions</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #5b6572;
    --line: #e2e6ea;
    --accent: #1f6feb;
    --correct-bg: #e6f6ea;
    --correct-border: #2f9e44;
    --wrong-bg: #fdecec;
    --wrong-border: #d64545;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: #f2f4f7;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13.5px;
    margin: 0 0 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 1px 3px rgba(20,20,30,0.04);
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .progress-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width .25s ease;
  }
  .qtext {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 16px;
  }
  .qimg {
    display: block;
    max-width: 100px;
    max-height: 100px;
    margin: 0 0 16px;
    object-fit: contain;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    font-size: 14.5px;
    cursor: pointer;
    line-height: 1.4;
    transition: border-color .15s, background .15s;
  }
  .option:hover:not(.locked) {
    border-color: var(--accent);
    background: #f2f6fd;
  }
  .option.selected-correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    font-weight: 600;
  }
  .option.selected-wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    font-weight: 600;
  }
  .option.reveal-correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
  }
  .option.locked {
    cursor: default;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled {
    opacity: 0.4;
    cursor: default;
  }
  button.secondary {
    background: none;
    border: 1px solid var(--line);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .start-screen, .result-screen {
    text-align: center;
    padding: 20px 8px;
  }
  .start-screen p, .result-screen p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }
  .score-big {
    font-size: 48px;
    font-weight: 800;
    margin: 8px 0 4px;
    color: var(--accent);
  }
  .score-label {
    color: var(--muted);
    font-size: 13.5px;
    margin-bottom: 24px;
  }
  .review-list {
    text-align: left;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .review-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .review-item .rq {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .review-item.correct { border-left: 4px solid var(--correct-border); }
  .review-item.wrong { border-left: 4px solid var(--wrong-border); }
  .tag-correct { color: var(--correct-border); font-weight: 600; }
  .tag-wrong { color: var(--wrong-border); font-weight: 600; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <h1>Driving Test Quiz</h1>
  <p class="subtitle">20 random questions pulled from a 405-question bank each round.</p>

  <div class="card" id="card">

    <div id="startScreen" class="start-screen">
      <p>Ready to test yourself? Each round picks 20 random questions with shuffled answer order.</p>
      <button class="primary" id="startBtn">Start Quiz</button>
    </div>

    <div id="quizScreen" class="hidden">
      <div class="progress-row">
        <span id="progressText">Question 1 of 20</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>
      <div class="qtext" id="qtext"></div>
      <img id="qimg" class="qimg hidden" alt="question sign">
      <div class="options" id="options"></div>
      <div class="actions">
        <button class="primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>

    <div id="resultScreen" class="hidden result-screen">
      <div class="score-label">You scored</div>
      <div class="score-big" id="finalScore">0 / 20</div>
      <div class="score-label" id="finalPct"></div>
      <button class="primary" id="restartBtn">Try 20 more</button>
      <div class="review-list" id="reviewList"></div>
    </div>

  </div>
</div>

let quiz = [];
let current = 0;
let score = 0;
let answered = false;
let reviewLog = [];

const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');
const qtext = document.getElementById('qtext');
const qimg = document.getElementById('qimg');
const optionsEl = document.getElementById('options');
const progressText = document.getElementById('progressText');
const scoreText = document.getElementById('scoreText');
const progressFill = document.getElementById('progressFill');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz() {
  const picked = shuffle(ALL_QUESTIONS).slice(0, 20);
  quiz = picked.map(item => {
    const order = shuffle([0, 1, 2]);
    return {
      qnum: item.q,
      question: item.question,
      img: item.img,
      options: order.map(i => item.options[i]),
      correctIndex: order.indexOf(item.answer)
    };
  });
  current = 0;
  score = 0;
  reviewLog = [];
}

function startQuiz() {
  buildQuiz();
  startScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  nextBtn.disabled = true;
  nextBtn.textContent = current === quiz.length - 1 ? 'Finish' : 'Next';
  const q = quiz[current];
  progressText.textContent = `Question ${current + 1} of ${quiz.length}`;
  scoreText.textContent = `Score: ${score}`;
  progressFill.style.width = `${((current) / quiz.length) * 100 + 5}%`;
  qtext.textContent = q.question;
  if (q.img) {
    qimg.src = `data:image/png;base64,${q.img}`;
    qimg.classList.remove('hidden');
  } else {
    qimg.classList.add('hidden');
  }
  optionsEl.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectOption(idx));
    optionsEl.appendChild(btn);
  });
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = quiz[current];
  const opts = Array.from(optionsEl.children);
  const isCorrect = idx === q.correctIndex;
  if (isCorrect) {
    score++;
    opts[idx].classList.add('selected-correct');
  } else {
    opts[idx].classList.add('selected-wrong');
    opts[q.correctIndex].classList.add('reveal-correct');
  }
  opts.forEach(o => o.classList.add('locked'));
  scoreText.textContent = `Score: ${score}`;
  nextBtn.disabled = false;

  reviewLog.push({
    qnum: q.qnum,
    question: q.question,
    chosen: q.options[idx],
    correctAnswer: q.options[q.correctIndex],
    isCorrect
  });
}

function nextQuestion() {
  if (current < quiz.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  document.getElementById('finalScore').textContent = `${score} / ${quiz.length}`;
  const pct = Math.round((score / quiz.length) * 100);
  document.getElementById('finalPct').textContent = `${pct}% correct`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  reviewLog.forEach(r => {
    const div = document.createElement('div');
    div.className = `review-item ${r.isCorrect ? 'correct' : 'wrong'}`;
    div.innerHTML = `
      <div class="rq">Q${r.qnum}. ${r.question}</div>
      <div>Your answer: <span class="${r.isCorrect ? 'tag-correct' : 'tag-wrong'}">${r.chosen}</span></div>
      ${r.isCorrect ? '' : `<div>Correct answer: <span class="tag-correct">${r.correctAnswer}</span></div>`}
    `;
    reviewList.appendChild(div);
  });
}

startBtn.addEventListener('click', startQuiz);
nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', startQuiz);
</script>
